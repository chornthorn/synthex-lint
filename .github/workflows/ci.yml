name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Analyze and test the plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/synthex_lint
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test
