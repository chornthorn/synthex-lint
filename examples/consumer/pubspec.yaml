name: consumer
description: Minimal package that enables the synthex_lint analyzer plugin.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dev_dependencies:
  synthex_lint:
    path: ../../packages/synthex_lint

# The rules are configured in synthex_lint.yaml. The same document can live
# under a `synthex_lint` key of this file instead; the dedicated file wins
# when both are present.
synthex_lint:
  version: 1
  severity: warning # default for rules that do not set their own
  architecture:
    version: 1
    severity: warning
    layers:
      - name: domain
        files: ["lib/domain/**"]
        severity: error
        forbiddenImports:
          - dart:io
          - uri: package:flutter/**
            severity: info
      - name: data
        files: ["lib/data/**"]
        severity: error
        mayImport: ["domain"]
      - name: presentation
        files: ["lib/presentation/**"]
        severity: error
        mayImport: ["domain", "data"]

  placement:
    version: 1
    placements:
      - files: ["lib/presentation/pages/*"]
        classesMustEndWith: [Page]
        severity: error
      - files: ["lib/presentation/view_models/*"]
        classesMustEndWith: [ViewModel]
        severity: error
      - files: ["lib/presentation/widgets/*"]
        classesMustEndWith:
          - suffix: Widget
            exclude: private
        severity: error
      - files: ["lib/data/**"]
        classesMustEndWith: Repository
        mustHaveSupertype: Repository
      - files: ["lib/domain/use_cases/*"]
        classesMustEndWith:
          - suffix: UseCase
            exclude: private
        severity: error

  encapsulation:
    version: 1
    severity: error
    encapsulations:
      - files: ["lib/presentation/view_models/*"]
        severity: error
        requirements:
          - fieldsPrivate:
              enabled: true
              severity: warning
          - privateFieldsFinal: false
          - noPublicSetters: true
          - requirePublicGetters: false
